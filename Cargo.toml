[package]
name = "rust-browser"
version = "0.1.0"
edition = "2024"
description = "Native CLI for persistent Camoufox browser profiles"

[[bin]]
name = "browserctl-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
camoufox = "=0.9.1"
camoufox-core = "=0.9.1"
camoufox-geoip = "=0.9.1"
camoufox-juggler = "=0.9.1"
camoufox-pkgman = "=0.9.1"
camoufox-store = { version = "=0.9.1", default-features = false, features = ["sqlite"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
directories = "6"
env_logger = "0.11"
fs2 = "0.4"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "c6a68e0cfd5f8b694a5f1a31d33abaad56226a4d" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "c6a68e0cfd5f8b694a5f1a31d33abaad56226a4d" }
libc = "0.2"
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# camoufox-geoip uses reqwest for proxy IP checks; enable its SOCKS backend.
reqwest = { version = "=0.12.28", default-features = false, features = ["socks"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time"] }
unicode-normalization = "0.1"
url = "2"

[dev-dependencies]
zip = "2"

[patch.crates-io]
# Keep all eight camoufox-rust 0.9.1 crates together at one local revision.
camoufox = { path = "vendor/camoufox" }
camoufox-core = { path = "vendor/camoufox-core" }
camoufox-geoip = { path = "vendor/camoufox-geoip" }
camoufox-juggler = { path = "vendor/camoufox-juggler" }
camoufox-pkgman = { path = "vendor/camoufox-pkgman" }
camoufox-store = { path = "vendor/camoufox-store" }
camoufox-virtdisplay = { path = "vendor/camoufox-virtdisplay" }
camoufox-webgl = { path = "vendor/camoufox-webgl" }
